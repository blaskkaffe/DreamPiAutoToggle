<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check-in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #f5f7fb; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; font: 2.2vh/1.3 sans-serif; color: #46536b; overflow: hidden; }
  img { max-width: 60vw; max-height: 55vh; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-1.5vh); } }
  #dots::after { content: ""; animation: dots 1.6s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<img src="logo.png" alt="">
<div>Starting the check-in board<span id="dots"></span></div>
<script>
// Shown by kiosk-session while the network and the board come up: the board's address is after the # in this page's own address.
// Asks the board every 2 s and opens it as soon as it answers (the same page also covers a board that is slow to start after a power cut).
var target = decodeURI(location.hash.slice(1));
var ping = "";
try { ping = new URL(target).origin + "/ping"; } catch (e) {}
function tryOpen() {
  if (!ping) return;
  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; setTimeout(tryOpen, 2000); } }, 4000);
  fetch(ping, { mode: "no-cors", cache: "no-store" }).then(function () {
    if (done) return;
    done = true; clearTimeout(timer); location.replace(target);
  }, function () {
    if (done) return;
    done = true; clearTimeout(timer); setTimeout(tryOpen, 2000);
  });
}
tryOpen();
</script>
</body>
</html>
