<div class="cimport">
 <textarea class="ctext" rows="4" placeholder="Paste CSV here, or choose a file" aria-label="CSV text"></textarea>
 <div class="bar">
  <input type="file" class="cfile" accept=".csv,text/csv,text/plain" aria-label="CSV file">
  <label class="sub tgl"><input type="checkbox" class="cbox neutral crep" aria-label="Switch off people that are not in the file">Switch off people that are not in the file</label>
  <button type="button" class="pill-s cgo">Import</button>
 </div>
 <div class="sub cmsg" role="status"></div>
</div>
