<div class="cimport">
 <textarea class="ctext" rows="4" placeholder="Paste CSV here, or choose a file" aria-label="CSV text"></textarea>
 <div class="srow">
  <span><span class="cname">No file chosen</span></span>
  <button type="button" class="pill-s cpick">Choose file</button>
  <input type="file" class="cfile" accept=".csv,text/csv,text/plain" aria-label="CSV file" hidden>
 </div>
 <label class="srow"><span>Switch off people that are not in the file</span><input type="checkbox" class="cbox neutral crep" aria-label="Switch off people that are not in the file"></label>
 <div class="bar end"><button type="button" class="pill-s pri c-green cgo">Import</button></div>
 <div class="sub cmsg" role="status"></div>
</div>
