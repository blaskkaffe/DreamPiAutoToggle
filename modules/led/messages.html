<div id="cal-pop" class="pop" role="dialog" aria-label="NeoPixel calibration"><div class="t">White balance and maximum brightness</div>
 <div class="range grid"><span>Red</span><input type="range" id="wb-r" aria-label="Red" min="0" max="255" step="1" style="accent-color:#f33"><span id="wb-r-v"></span></div>
 <div class="range grid"><span>Green</span><input type="range" id="wb-g" aria-label="Green" min="0" max="255" step="1" style="accent-color:#3f3"><span id="wb-g-v"></span></div>
 <div class="range grid"><span>Blue</span><input type="range" id="wb-b" aria-label="Blue" min="0" max="255" step="1" style="accent-color:#39f"><span id="wb-b-v"></span></div>
 <div class="bar center"><button class="pill-s fixw" id="wb-preview" type="button">Preview on LED</button><button class="pill-s" id="wb-reset" type="button">Reset to neutral</button></div>
 <div class="range grid" style="border-top:1px solid var(--line)"><span>Brightness</span><input type="range" id="led-bright" aria-label="Maximum brightness" min="0" max="1000" step="1"><span id="led-bright-v"></span></div>
 <div class="sub" style="margin:0 0 8px">Enable "Preview", turn down whichever of R, G or B looks too strong until light is neutral white and leave at least one at 255. Adjust maximum for every LED</div>
 <div class="bar end"><button class="pill-s" id="cal-done" type="button">Done</button></div></div>
